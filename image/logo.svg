<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14"
        fill="#0f172a" stroke="url(#g1)" stroke-width="2.5"/>

  <!-- Символ "<" -->
  <path d="M 22 22 L 12 32 L 22 42"
        fill="none" stroke="url(#g1)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Символ ">" -->
  <path d="M 42 22 L 52 32 L 42 42"
        fill="none" stroke="url(#g1)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Слэш "/" в центре -->
  <line x1="36" y1="20" x2="28" y2="44"
        stroke="url(#g2)" stroke-width="4"
        stroke-linecap="round"/>

  <!-- Точка-атом -->
  <circle cx="32" cy="32" r="2.5" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>